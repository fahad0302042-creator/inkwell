name: inkwell
description: An Android-first Flutter comic reader with native extension discovery.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.13.4
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  shared_preferences: ^2.5.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/covers/
    - assets/pages/
    - assets/fonts/Lora-OFL.txt
    - assets/fonts/DMSans-OFL.txt
  fonts:
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora.ttf
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans.ttf
