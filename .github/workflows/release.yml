name: Release

# Fork (Ktv): builds a release APK signed with the fork's stable key and publishes it as a
# GitHub Release, which is what the in-app self-updater reads.
#
# Requirements (repo Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
#
# The version MUST be plain numeric semver (e.g. 9.5.0). A suffix such as "-ktv1" makes the
# in-app updater classify the release as unstable and hide it.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, plain semver (e.g. 9.5.0)"
        required: true
      notes:
        description: "Release notes"
        required: false
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK components
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMGR="$(command -v sdkmanager)"
          fi
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must be plain semver like 9.5.0 (got: $VERSION)."
            echo "::error::Suffixed versions are treated as unstable by the in-app updater and will be hidden."
            exit 1
          fi
          MAJOR="${VERSION%%.*}"
          REST="${VERSION#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST#*.}"
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "Version $VERSION -> versionCode $CODE"
          {
            echo "KTV_VERSION=$VERSION"
            echo "KTV_VERSION_CODE=$CODE"
          } >> "$GITHUB_ENV"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set on this repository."
            echo "::error::Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD under"
            echo "::error::Settings -> Secrets and variables -> Actions. See FORK_NOTES.md."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ktv-release.p12"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/ktv-release.p12" >> "$GITHUB_ENV"

      - name: Assemble signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PktvVersionName="$KTV_VERSION" \
            -PktvVersionCode="$KTV_VERSION_CODE" \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Verify signature and identity
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER="$(find "$SDK/build-tools" -name apksigner | sort | tail -n 1)"
          AAPT2="$(find "$SDK/build-tools" -name aapt2 | sort | tail -n 1)"
          APK="$(find app/build/outputs/apk/release -name '*.apk' | sort | head -n 1)"
          echo "APK: $APK"
          ls -lh "$APK"
          PKG="$("$AAPT2" dump packagename "$APK")"
          echo "package: $PKG"
          if [ "$PKG" != "app.ktv.reader" ]; then
            echo "::error::unexpected package name '$PKG' (expected app.ktv.reader)"
            exit 1
          fi
          "$APKSIGNER" verify --print-certs "$APK"
          echo "::notice::signed and verified: $APK"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -name '*.apk' | sort | head -n 1)"
          TITLE="v${KTV_VERSION}"
          BODY="${NOTES:-Ktv ${KTV_VERSION} (Kotatsu ${KTV_VERSION} fork build).}"
          if gh release view "$TITLE" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TITLE already exists — uploading APK to it."
            gh release upload "$TITLE" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TITLE" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --notes "$BODY" \
              "$APK"
          fi
          echo "::notice::released $TITLE — the in-app updater reads this release name verbatim."
