name: Keiyoushi runtime smoke test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Build Android emulator app
        run: |
          flutter pub get --enforce-lockfile
          flutter build apk --debug --target-platform android-x64 --no-pub
      - name: Download hash-pinned xkcd extension
        run: python3 tools/fetch_smoke_extension.py /tmp/inkwell-xkcd.apk
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test installed extension on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          ram-size: 2048M
          disable-animations: true
          script: |
            adb install /tmp/inkwell-xkcd.apk
            cd android && ./gradlew :app:connectedDebugAndroidTest -Ptarget-platform=android-x64 -Pandroid.testInstrumentationRunnerArguments.class=dev.inkwell.inkwell.KeiyoushiSmokeTest
      - name: Save device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Keiyoushi-smoke-results
          path: |
            build/app/reports/androidTests/
            build/app/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 7
