name: Build

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
    inputs:
      task:
        description: Gradle task to run
        required: true
        default: assembleDebug
        type: choice
        options:
          - assembleDebug
          - assembleRelease
          - testDebugUnitTest

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ github.event.inputs.task || 'Assemble debug APK' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK components
        run: |
          # The ubuntu runner image ships the Android SDK (ANDROID_HOME/ANDROID_SDK_ROOT).
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "Android SDK at $SDK"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --install "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Run Gradle
        run: |
          ./gradlew ${TASK} --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
        env:
          TASK: ${{ github.event.inputs.task || 'assembleDebug' }}

      - name: Verify and list APKs
        if: ${{ hashFiles('app/build/outputs/apk/**/*.apk') != '' }}
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          apksigner="$(find "$SDK/build-tools" -name apksigner | sort | tail -n 1)"
          while IFS= read -r apk; do
            echo "::group::$apk"
            ls -lh "$apk"
            "$apksigner" verify --print-certs "$apk" || true
            echo "::endgroup::"
          done < <(find app/build/outputs/apk -name '*.apk' | sort)

      - name: Upload APKs
        if: ${{ hashFiles('app/build/outputs/apk/**/*.apk') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: kotatsu-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: ${{ always() && hashFiles('app/build/reports/tests/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14
