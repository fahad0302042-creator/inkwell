name: Build

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
    inputs:
      task:
        description: Gradle task to run
        required: true
        default: assembleDebug
        type: choice
        options:
          - assembleDebug
          - assembleRelease
          - testDebugUnitTest

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ github.event.inputs.task || 'Assemble debug APK' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK components
        run: |
          # The ubuntu runner image ships the Android SDK (ANDROID_HOME/ANDROID_SDK_ROOT).
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "Android SDK at $SDK"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --install "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Run Gradle
        run: |
          ./gradlew ${TASK} --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
        env:
          TASK: ${{ github.event.inputs.task || 'assembleDebug' }}

      - name: Verify and list APKs
        if: ${{ hashFiles('app/build/outputs/apk/**/*.apk') != '' }}
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          apksigner="$(find "$SDK/build-tools" -name apksigner | sort | tail -n 1)"
          aapt2="$(find "$SDK/build-tools" -name aapt2 | sort | tail -n 1)"
          while IFS= read -r apk; do
            echo "::group::$apk"
            ls -lh "$apk"
            pkg="$("$aapt2" dump packagename "$apk")"
            echo "package: $pkg"
            # Fork identity check: this must be the Ktv fork, not an upstream-named build.
            case "$pkg" in
              app.ktv.reader|app.ktv.reader.debug) echo "OK: Ktv fork identity" ;;
              *) echo "::error::unexpected package name '$pkg'"; exit 1 ;;
            esac
            "$apksigner" verify --print-certs "$apk" || true
            echo "::endgroup::"
          done < <(find app/build/outputs/apk -name '*.apk' | sort)

      - name: Upload APKs
        if: ${{ hashFiles('app/build/outputs/apk/**/*.apk') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: kotatsu-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: ${{ always() && hashFiles('app/build/reports/tests/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

  release-check:
    # Fork (Ktv): releases are how self-update is delivered, so keep the R8/minified release
    # path compiling on every push even though publishing needs the signing secrets.
    name: Release build check (unsigned)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK components
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMGR="$(command -v sdkmanager)"
          fi
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Assemble release (unsigned)
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Verify release APK identity
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          AAPT2="$(find "$SDK/build-tools" -name aapt2 | sort | tail -n 1)"
          APK="$(find app/build/outputs/apk/release -name '*.apk' | sort | head -n 1)"
          echo "APK: $APK"
          ls -lh "$APK"
          PKG="$("$AAPT2" dump packagename "$APK")"
          echo "package: $PKG"
          if [ "$PKG" != "app.ktv.reader" ]; then
            echo "::error::unexpected package name '$PKG' (expected app.ktv.reader)"
            exit 1
          fi
          echo "::notice::release path builds and reports the Ktv identity"
